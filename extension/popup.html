<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoonDigest</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="top">
        <div class="title">
          <strong>MoonDigest</strong>
          <button id="refreshBtn" type="button" class="icon-btn" title="刷新" aria-label="刷新">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
              <path d="M21 3v5h-5"></path>
              <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
              <path d="M8 16H3v5"></path>
            </svg>
          </button>
        </div>
        <button id="settingsBtn" type="button" class="ghost">设置</button>
      </header>

      <p id="status" class="status">准备就绪</p>

      <label class="label" for="subtitleSelect">语言</label>
      <select id="subtitleSelect"></select>
      <textarea id="preview" readonly wrap="off" aria-label="字幕预览"></textarea>

      <div class="actions">
        <button id="downloadBtn" type="button">下载字幕</button>
        <button id="readingViewBtn" type="button">专注模式</button>
      </div>
      <button id="summaryBtn" type="button" class="primary"><span class="ai-spark" aria-hidden="true"></span>AI 总结</button>
      <div class="section-title">Markdown 笔记</div>
      <div class="actions">
        <button id="copyBtn" type="button">复制 Markdown</button>
        <button id="mdBtn" type="button">下载 .md</button>
        <button id="sendBtn" type="button" hidden><img class="obsidian-mark" src="/icons/obsidian.svg" alt="" /> 写入 Obsidian</button>
      </div>
      <details class="details">
        <summary>详情</summary>
        <section class="props">
          <div class="prop-row"><span class="k">标题</span><span id="propTitle" class="v"></span></div>
          <div class="prop-row"><span class="k">链接</span><span id="propUrl" class="v"></span></div>
          <div class="prop-row"><span class="k">创建时间</span><span id="propCreated" class="v"></span></div>
          <div class="prop-row"><span class="k">标签</span><span id="propTags" class="v"></span></div>
        </section>
      </details>
      <div class="actions global-actions">
        <button id="triageBtn" type="button">打开分拣台<span id="triageHint" class="link-hint" hidden>（仅 B 站收藏夹）</span></button>
        <button id="historyBtn" type="button">视频记录</button>
      </div>
    </main>

    <script src="./limits.js"></script>
    <script src="./sites.js"></script>
    <script src="./download.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
