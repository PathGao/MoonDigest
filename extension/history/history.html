<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MoonDigest · 视频记录</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="./history.css" />
  </head>
  <body>
    <header class="topbar">
      <strong class="brand">视频记录</strong>
      <span id="count" class="count"></span>
      <input id="search" type="search" placeholder="搜索标题、备注或对话内容" aria-label="搜索标题、备注或对话内容" />
    </header>
    <div class="bulkbar">
      <label><input id="selectAll" type="checkbox" /> <span id="selectAllLabel">全选</span></label>
      <button id="bulkMd" type="button" disabled>下载选中的 .md</button>
      <span id="status" class="status" role="status"></span>
      <span class="destructive">
        <button id="bulkDelete" type="button" class="danger" disabled>删除选中的 AI 对话</button>
        <button id="clearAll" type="button" class="danger" disabled>清空全部 AI 对话</button>
      </span>
    </div>
    <main id="list" class="list"><p class="empty">正在加载…</p></main>

    <script src="../limits.js"></script>
    <script src="../errors.js"></script>
    <script src="../settings.js"></script>
    <script src="../typing.js"></script>
    <script src="../sites.js"></script>
    <script src="../tag-core.js"></script>
    <script src="../note.js"></script>
    <script src="../download.js"></script>
    <script type="module" src="./history.js"></script>
  </body>
</html>
