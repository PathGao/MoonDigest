name: Check

on:
  pull_request:
  push:
    branches: [main]
  # Release runs this on the tag before anything is published.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  check:
    # The ruleset requires "check": the Linux run keeps that name, Windows reports as "check (windows)".
    name: ${{ matrix.os == 'windows-latest' && 'check (windows)' || 'check' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Selftests
        run: node scripts/selftest.mjs

      - name: Startup in Chrome
        run: node scripts/smoke.mjs
