name: Check

on:
  pull_request:
  push:
    branches: [main]
  # Release runs this on the tag before anything is published.
  workflow_call:
    inputs:
      ref:
        type: string
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Selftests
        run: for f in extension/*.selftest.js extension/triage/*.selftest.js extension/history/*.selftest.js; do node "$f" || exit 1; done

      - name: Startup in Chrome
        run: node scripts/smoke.mjs
